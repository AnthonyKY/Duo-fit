# Every push runs the whole test suite on GitHub (idea from astra's V2 branch).
# A red ✗ next to a commit on GitHub means something broke; Pages still publishes main.
name: DUOFIT tests
on:
  push:
    branches: [main, 'claude/**', 'astra/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [session-history.test.cjs, full.js, nut2.js, ios.js, all.js, v2.js, variety.js, pages.js, budget.test.cjs, budget-iphone.js, priorities.js, backup.js, erase.js, coach.js, tanita.js, tanita-calc.js, stabilite.js, fixes.js, session.js, ermite.js]
        engine: [chromium]
        device: ['']
        # the same browser suites again in WebKit (Safari's engine, used by every browser on iPhone) on an iPhone 16 Plus
        include:
          - {suite: ermite.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: session.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: full.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: nut2.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: ios.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: all.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: v2.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: variety.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: pages.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: budget-iphone.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: priorities.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: backup.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: erase.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: coach.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: tanita.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: tanita-calc.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: stabilite.js, engine: webkit, device: 'iPhone 16 Plus'}
          - {suite: fixes.js, engine: webkit, device: 'iPhone 16 Plus'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: "${{ !endsWith(matrix.suite, '.test.cjs') }}"
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run ${{ matrix.suite }}
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          BROWSER: ${{ matrix.engine }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          if [[ "$SUITE" == *.test.cjs ]]; then node --test "tests/$SUITE"; exit 0; fi
          python3 -m http.server 8766 > /tmp/http.log 2>&1 &
          for attempt in {1..50}; do curl -fsS http://localhost:8766/index.html -o /dev/null && break; sleep .2; done
          node "tests/$SUITE" | tee /tmp/results
          if grep -Eq '^FAIL |^CRASH' /tmp/results; then exit 1; fi
  # one check to require before anything reaches main: green only if every suite above passed
  all-tests:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every suite passed (Chromium + WebKit)
        run: test "${{ needs.test.result }}" = "success"
