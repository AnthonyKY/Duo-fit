# Every version that reaches main with all tests green is kept as a GitHub Release:
#   duofit-<VER>-index.html                  the app exactly as it was (open it, or host it again)
#   duofit-<VER>-code.zip                    the whole repository at that version
#   duofit-<VER>-historique-complet.bundle   every version and branch so far ("git clone <file>.bundle" rebuilds the repo)
# Releases survive anything that happens to the main branch; download the latest one to iCloud from time to time.
name: Version copies
on:
  workflow_run:
    workflows: [DUOFIT tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:   # "Run workflow" button: save the current main now
permissions:
  contents: write
jobs:
  keep:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Save this version (app, code, full history)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          VER=$(grep -o 'const VER="2[^"]*"' index.html | head -1 | cut -d'"' -f2)
          [[ "$VER" =~ ^[0-9a-z-]+$ ]] || { echo "version not found"; exit 1; }
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then TAG="v$VER-${SHA:0:7}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "already saved"; exit 0; fi
          cp index.html "duofit-$VER-index.html"
          git archive --format=zip -o "duofit-$VER-code.zip" "$SHA"
          # every branch as a real branch in the bundle, so "git clone file.bundle" brings them all back
          for b in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -vx HEAD); do git branch -f "$b" "origin/$b" >/dev/null; done
          git checkout -q main
          git bundle create "duofit-$VER-historique-complet.bundle" HEAD --branches --tags
          git bundle verify "duofit-$VER-historique-complet.bundle"
          gh release create "$TAG" --target "$SHA" --title "Duo-fit $VER ($(date -u +%Y-%m-%d))" \
            --notes "Copie automatique de la version $VER (commit ${SHA:0:7}), publiée après tous les tests verts. index.html = l'app telle quelle ; code.zip = le dépôt à cette version ; historique-complet.bundle = toutes les versions et branches (git clone fichier.bundle redonne le dépôt complet, sur main)." \
            "duofit-$VER-index.html" "duofit-$VER-code.zip" "duofit-$VER-historique-complet.bundle"
