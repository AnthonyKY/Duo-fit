# Test version of CollabFit on Netlify (apps/web). DUOFIT itself stays on GitHub Pages from main.
# The two public settings (COLLABFIT_SUPABASE_URL, COLLABFIT_SUPABASE_ANON_KEY = publishable key) are set in Netlify's
# environment variables, never a secret key.
[build]
  command = "npm run build:web"
  publish = "apps/web/dist"
  # Free plan: each published deploy costs 15 of the 300 monthly credits. Rebuild ONLY when something the site is built
  # from changes: the list is scripts/app-paths.txt (shared with the staging workflow, checked by scripts/check-app-paths.mjs).
  # Database, tests, workflows and docs never touch the site. Exit 0 = skip this build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- $(cat scripts/app-paths.txt)"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
