# Test version of CollabFit on Netlify (apps/web). DUOFIT itself stays on GitHub Pages from main.
# The two public settings (COLLABFIT_SUPABASE_URL, COLLABFIT_SUPABASE_ANON_KEY = publishable key) are set in Netlify's
# environment variables, never a secret key.
[build]
  command = "npm run build:web"
  publish = "apps/web/dist"
  # Free plan: each published deploy costs 15 of the 300 monthly credits. Rebuild ONLY when the app itself changes
  # (database, tests, workflows and docs never touch the site). Exit 0 = skip this build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web/src apps/web/index.html apps/web/scripts apps/web/package.json packages/domain/src packages/domain/package.json package.json package-lock.json"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
