<style>

button{cursor:pointer}.p{background:var(--ac);color:var(--on);border:0;font-weight:700}.w{width:100%;padding:13px;margin-top:8px}

.r>.hb{flex:none;padding:6px 10px;font-size:13px}.ok{background:var(--ac);color:var(--on);border:0}.bar{height:6px;background:var(--c2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}

function bc(it,o={}){if(!it.length)return`<p class=mu>${t("nod")}</p>`;const W=320,H=150,L=38,R=8,T=10,B=24,tk=ax(0,Math.max(o.tgt?o.tgt*1.2:0,...it.map(b=>b.y))),mx=tk[tk.length-1]||1,n=it.length,bw=Math.max(4,Math.min(26,(W-L-R)/n-2)),
X=i=>L+(i+.5)*(W-L-R)/n,Y=y=>T+(1-y/mx)*(H-T-B);
let g=tk.map(v=>`<line x1=${L} x2=${W-R} y1=${Y(v)} y2=${Y(v)} stroke="var(--bd)" /><text x=${L-6} y=${Y(v)+3.5} text-anchor=end class=axl>${v.toLocaleString(S.lg)}</text>`).join("");
g+=`<text x=${X(0)} y=${H-6} text-anchor=middle class=axl>${it[0].l}</text>`+(n>1?`<text x=${X(n-1)} y=${H-6} text-anchor=middle class=axl>${it[n-1].l}</text>`:"");
const r=Math.min(4,bw/2);let m=it.map((b,i)=>{if(!b.y)return"";const x=X(i)-bw/2,y=Y(b.y),h=Y(0)-y,rr=Math.min(r,h);return`<path d="M${x} ${Y(0)}V${y+rr}Q${x} ${y} ${x+rr} ${y}H${x+bw-rr}Q${x+bw} ${y} ${x+bw} ${y+rr}V${Y(0)}Z" fill="var(--ch)" />`}).join("");
if(o.tgt)m+=`<line x1=${L} x2=${W-R} y1=${Y(o.tgt)} y2=${Y(o.tgt)} stroke="var(--tx)" stroke-width=1 stroke-dasharray="4 4" opacity=.6 /><text x=${W-R} y=${Y(o.tgt)-4} text-anchor=end class=axl>${t("goal")} ${o.tgt}</text>`;

function hook(){document.querySelectorAll(".ch").forEach(el=>{const c=CH[el.dataset.i],sv=el.querySelector("svg"),xh=el.querySelector(".xh"),hc=el.querySelector(".hc"),tt=el.querySelector(".tt");

function tile(v,l,s){return`<div class=tl><div class=tv>${v}</div><div class=mu>${l}</div>${s?`<div class=ts>${s}</div>`:""}</div>`}

// strength
const ids=[...new Set(d.logs.flatMap(l=>Object.keys(l.ex)))].filter(i=>i!="pl");ids.sort((a,b)=>d.logs.filter(l=>l.ex[b]).length-d.logs.filter(l=>l.ex[a]).length);
if(!ids.includes(U.ex))U.ex=ids[0]||"";
let sc=`<p class=mu>${t("nod")}</p>`,sub="";
if(U.ex){const pts=L.filter(l=>l.ex[U.ex]).map(l=>{const b=l.ex[U.ex].reduce((a,s)=>e1(s.w,s.r)>e1(a.w,a.r)?s:a);return{x:l.date,y:Math.round(e1(b.w,b.r)*10)/10,top:Math.max(...l.ex[U.ex].map(s=>s.w)),tip:`<b>${fd(l.date)}</b><br>${f1(b.w)} kg × ${b.r}<br>${t("e1")} ${f1(e1(b.w,b.r))} kg`}});
sc=lc(pts);if(pts.length>1){const a=pts[0].y,z=pts[pts.length-1].y,dd=z-a;sub=`<div class=ts style="margin:2px 0 6px">${dd>=0?"▲":"▼"} ${dd>=0?"+":""}${f1(dd)} kg (${dd>=0?"+":""}${Math.round(dd/a*100)} %) · ${t("top")} ${f1(pts[0].top)} → ${f1(pts[pts.length-1].top)} kg</div>`}}
h+=`<div class=c><b>${t("str")}</b><p class=mu style=margin:2px 0>${t("e1x")}</p><select style="width:100%;margin:6px 0" onchange="U.ex=this.value;go()">${ids.map(i=>`<option value=${i} ${i==U.ex?"selected":""}>${nm(i)}</option>`).join("")}</select>${sub}${sc}</div>`;

const rows=ids.map(i=>{const ls=L.filter(l=>l.ex[i]);if(!ls.length)return null;const tw=l=>Math.max(...l.ex[i].map(s=>s.w)),a=tw(ls[0]),b=Math.max(...ls.map(tw));return{i,a,b,n:ls.length}}).filter(Boolean);
h+=`<div class=c><b>${t("rec")}</b>${rows.length?`<table><tr><th>${t("exn")}</th><th>${t("start2")}</th><th>${t("best")}</th><th>Δ</th></tr>${rows.map(r=>`<tr><td>${nm(r.i)}</td><td>${f1(r.a)}</td><td><b>${f1(r.b)}</b></td><td class="${r.b>r.a?"up":""}">${r.b>r.a?"+"+f1(r.b-r.a):"="}</td></tr>`).join("")}</table><p class=mu>kg · ${t("topw")}</p>`:`<p class=mu>${t("nod")}</p>`}</div>`;
// weekly volume & frequency

h+=`<div class=c><b>${t("fw")}</b>${bc(wks.map(w=>({l:fd(w.s),y:w.ls.length,tip:`<b>${t("wof")} ${fd(w.s)}</b><br>${w.ls.length}/3`})),{tgt:3})}</div>`;
// sets per muscle, last 7 days
const sm={};d.logs.filter(l=>Date.now()-l.date<6048e5).forEach(l=>Object.keys(l.ex).forEach(i=>{const g=GR[i];if(g)sm[g]=(sm[g]||0)+l.ex[i].length}));const smx=Math.max(20,...Object.values(sm));
h+=`<div class=c><b>${t("mus")}</b><p class=mu style=margin:2px 0 8px>${t(S.p=="M"?"musM":"musF")}</p>${Object.keys(GN).map(g=>`<div class=hb2><span>${GN[g][k]}</span><i><em style="width:${(sm[g]||0)/smx*100}%"></em></i><b>${sm[g]||0}</b></div>`).join("")}</div>`;

const ma=bw.map((p,i)=>{const s=bw.slice(Math.max(0,i-6),i+1);return{x:p.x,y:Math.round(s.reduce((a,q)=>a+q.w,0)/s.length*10)/10}});

[["st",t("st"),""],["hr",t("hr")," bpm"],["sl",t("sl")," h"]].forEach(([f,l,u])=>{const a=hd.filter(x=>x[f]!=null);h+=`<div class=c><b>${l}</b>${lc(a.map(p=>({x:p.x,y:p[f],tip:`<b>${fd(p.x)}</b><br>${f1(p[f])}${u}`})))}</div>`});

return h}
