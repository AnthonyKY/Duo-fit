oce:["Overhead cable extension","Extension triceps au-dessus de la tête","Triceps","Triceps","C",1,"Slight hinge, elbows by ears, extend and stretch.","Buste un peu penché, coudes près des oreilles, tendre puis étirer.","Arching back.","Cambrer le dos.",["rpd"]],

  const pf=D().pf,budget=Number(pf.time)||60,dr=draw(w),beg=pf.lvl==="beg",priority=KEY_SLOTS[S.p][w];
  const make=(base,i,id)=>{
    const e=[...base.slice(0,7),i];e[0]=id;
    if(pf.noOverhead&&base[0]==="ms"){e[2]=12;e[3]=18;e[4]=75}
    if(XR[id]&&(id!==base[0]||id==="sp"))[e[2],e[3]]=XR[id][beg?1:0];
    if(beg)e[5]=Math.min(4,e[5]+1);
    return e;
  };
  const templates=prog()[w].ex,n=templates.length,main=i=>SL[S.p][w][i]?.[1]==="m";
  const order=templates.map((_,i)=>i);
  if(pf.noOverhead&&S.p==="M"&&w==="A")order.splice(0,2,1,0);
  const ex=order.filter(i=>dr.ids[i]).map(i=>make(templates[i],i,dr.ids[i]));
  const missing=order.filter(i=>!dr.ids[i]);
  const groups=ex.map(e=>GR[e[0]]);
  const required={M:{A:[["ch"],["sh"]],B:[["bk"],["ar"]],C:[["lg"],["sh"]]},F:{A:[["lg"],["gl"]],B:[["ch","bk","sh"],["co"]],C:[["gl"],["lg"]]}}[S.p][w];
  const unavailable=required.some(group=>!group.some(id=>groups.includes(id)));
  const gm=wGen(budget),wu=dr.wu.slice(0,wDrills(budget,w));
  const first=ex[0],second=ex[1];
  const ramp=first?(isBW(first[0])?1:budget<=30?2:3):0;
  const feeler=second&&main(second[7])&&!isBW(second[0])&&GR[second[0]]!==GR[first[0]]?1:0;
  const wm=gm+wu.length+ramp+feeler;
  let cm={loss:15,recomp:10}[pf.goal]||0,cut=0,red=0,bon=0;
  const over=()=>est(ex,cm,wm)>budget;
  const add=pf.lvl==="adv"||budget>=75;
  if(add)ex.filter(e=>main(e[7])).forEach(e=>e[1]++);
  if(budget>=75)for(const [i,[,base]] of BON[S.p][w].entries()){
    if(!dr.bon[i])continue;
    ex.push(make(base,n+i,dr.bon[i]));if(over())ex.pop();else bon++;
  }
  if(budget>=90)for(const e of ex){
    if(!main(e[7])&&e[1]<3){e[1]++;if(over())e[1]--}
  }
  while(cm>0&&over())cm=Math.max(0,cm-5);
  while(ex.length&&over()){
    const endFirst=ex.slice().reverse();
    const secondary=e=>!priority.includes(e[7])&&!main(e[7]);
    const trim=endFirst.find(e=>secondary(e)&&e[1]>2)||endFirst.find(e=>!main(e[7])&&e[1]>2)||
      (budget<=30&&endFirst.find(e=>e[1]>2));
    if(trim){trim[1]--;red++;continue}
    const remove=endFirst.find(e=>secondary(e)&&required.every(group=>ex.some(other=>other!==e&&group.includes(GR[other[0]]))));
    if(remove){ex.splice(ex.indexOf(remove),1);if(remove[7]>=n)bon--;else cut++;continue}
    const shorten=endFirst.find(e=>e[1]>1);
    if(shorten){shorten[1]--;red++;continue}
    const optional=endFirst.find(e=>required.every(group=>ex.some(other=>other!==e&&group.includes(GR[other[0]]))));
    if(!optional)break;
    ex.splice(ex.indexOf(optional),1);if(optional[7]>=n)bon--;else cut++;
  }
  const timing=budgetParts(ex,cm,wm);
  return {ex,cm,cut,add,bon,red,wm,wu,g:dr.g,gm,ramp:ramp+feeler,budget,timing,missing,
    unavailable:unavailable||timing.total>budget*60,tooShort:!unavailable&&timing.total>budget*60,dur:Math.ceil(timing.total/60)};
}
