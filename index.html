<style>
:root{--bg:#121417;--cd:#1c2025;--c2:#262b32;--tx:#eef2f4;--mu:#8b96a0;--ac:#34e0a1;--on:#06241a;--bd:#2d333b;--ch:#19ad78;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f5f6;--cd:#fff;--c2:#e8ecee;--tx:#14181b;--mu:#5d6871;--ac:#0b9f6d;--on:#fff;--bd:#d5dbdf;--ch:#0b9f6d;color-scheme:light}}
:root[data-theme=light]{--ch:#0b9f6d;--bg:#f3f5f6;--cd:#fff;--c2:#e8ecee;--tx:#14181b;--mu:#5d6871;--ac:#0b9f6d;--on:#fff;--bd:#d5dbdf;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,Segoe UI,sans-serif}
#v{max-width:720px;margin:auto;padding:14px 14px 170px}h1{font-size:26px;margin:6px 0}h2{font-size:18px;margin:0 0 6px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0;}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.mu{color:var(--mu);font-size:13px}.t{display:inline-block;background:var(--c2);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--c2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button{cursor:pointer}.p{background:var(--ac);color:var(--on);border:0;font-weight:700}.w{width:100%;padding:13px;margin-top:8px}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1;min-width:0}.s{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:6px;margin:5px 0;align-items:center}.s input{width:100%;text-align:center}
.r>.hb{flex:none;padding:6px 10px;font-size:13px}.s input::placeholder{color:var(--mu);opacity:.55}.sg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.sg button{flex:1 1 28%;padding:8px 4px;font-size:13px}.sg .on{background:var(--ac);color:var(--on);border:0;font-weight:700}.fl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}.fl input{width:120px;text-align:right}.lb{font-weight:700;margin:12px 0 2px}.ml{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.ml b{font-size:13px}.ok{background:var(--ac);color:var(--on);border:0}.bar{height:6px;background:var(--c2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}nav button{flex:1;border:0;background:none;border-radius:0;padding:12px 2px;font-size:12px;color:var(--mu)}nav .on{color:var(--ac);font-weight:700}
#tm{position:fixed;left:10px;right:10px;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--cd);border:1px solid var(--ac);border-radius:14px;padding:8px 12px;display:none;align-items:center;gap:6px}#tm b{font-size:24px;flex:1;font-variant-numeric:tabular-nums}
.pf{display:flex;gap:6px;justify-content:space-between}.pf div{display:flex;gap:6px}.pf button{padding:6px 14px}.pf .on{background:var(--ac);color:var(--on);border:0;font-weight:700}textarea{width:100%;min-height:80px}svg{width:100%;height:auto}.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.tl{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px}.tv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.ts{font-size:13px;color:var(--tx)}.ch{position:relative;touch-action:pan-y}.axl{font-size:10px;fill:var(--mu);font-variant-numeric:tabular-nums}.tt{display:none;position:absolute;top:2px;background:var(--tx);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;z-index:2}.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin:4px 0}.lg span{display:flex;align-items:center;gap:5px}.ld{width:7px;height:7px;border-radius:9px;background:var(--mu);opacity:.6}.ll{width:14px;height:2px;background:var(--ch)}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}th{text-align:left;color:var(--mu);font-weight:500}td,th{padding:6px 4px;border-bottom:1px solid var(--bd)}td:not(:first-child),th:not(:first-child){text-align:right}.up{color:var(--ch);font-weight:700}.hb2{display:grid;grid-template-columns:105px 1fr 28px;gap:8px;align-items:center;margin:5px 0;font-size:13px}.hb2 i{height:8px;background:var(--c2);border-radius:9px;overflow:hidden}.hb2 em{display:block;height:100%;background:var(--ch);border-radius:9px}.hb2 b{text-align:right}.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g input{width:100%}
[hidden],#tm[hidden]{display:none!important}
.session-clock{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:9px 14px;margin:8px 0 12px}
.session-clock strong{display:block;color:var(--ac);font-size:25px;line-height:1.15;font-variant-numeric:tabular-nums}
.tip-text,.rest-link{color:var(--ac);font-size:13px}
.rest-link{background:none;border:0;padding:3px 0;text-decoration:underline;text-underline-offset:2px}
#tm{max-width:692px;margin:auto;z-index:3;display:flex}
#tm strong{flex:1;color:var(--ac)}#tm button:disabled{opacity:.45}
#nv{z-index:4}.saved-note,#action-detail{white-space:pre-wrap;overflow-wrap:anywhere}
dialog{width:min(92vw,390px);box-sizing:border-box;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:20px}
dialog::backdrop{background:rgb(0 0 0 / .58)}dialog .r{margin-top:18px}dialog button{min-height:44px}
#notice,#storage-warning{max-width:680px;margin:8px auto;padding:10px 14px;border:1px solid var(--ac);border-radius:10px;background:var(--cd);color:var(--tx)}
#notice{position:fixed;left:12px;right:12px;bottom:calc(122px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none}
@media(max-width:480px){input,textarea,select{font-size:16px}.history-entry>.r{align-items:flex-start}.session-clock button,#tm button,.s button{min-height:40px}.session-clock{padding:7px 12px}}

cp:["Machine chest press","Développé pecs machine","Chest, triceps","Pectoraux, triceps","M",0,"Handles mid-chest, shoulders back and down. Control the return.","Poignées mi-poitrine, épaules basses et en arrière. Contrôler le retour.","Shoulders shrugging.","Hausser les épaules.",["idp"]],
pd:["Pec deck fly","Butterfly (pec deck)","Chest","Pectoraux","M",0,"Slight elbow bend, squeeze in front, stretch under control.","Coudes légèrement fléchis, serrer devant, étirer en contrôle.","Overstretching shoulders.","Étirement excessif des épaules.",["cp"]],

dlr:["DB lateral raise","Élévation latérale haltères","Side delts","Deltoïde latéral","DB",0,"Light weights, slight elbow bend, raise to shoulder height, lower slowly.","Charge légère, coudes fléchis, monter à hauteur d'épaule, descendre lentement.","Momentum.","Utiliser l'élan.",["clr"]],

cc:["Cable crunch","Crunch à la poulie","Abs","Abdos","C",0,"Kneel, curl ribs toward pelvis; hips still.","À genoux, enrouler les côtes vers le bassin ; hanches fixes.","Pulling with arms.","Tirer avec les bras.",["pl"]],

idc:["Incline DB curl","Curl incliné haltères","Biceps","Biceps","DB",1,"Bench 60°, arms behind torso, curl without swinging.","Banc à 60°, bras derrière le buste, fléchir sans élan.","Shoulders rolling forward.","Épaules qui avancent.",[]],
lp:["Leg press","Presse à cuisses","Quads, glutes","Quadriceps, fessiers","M",0,"Feet shoulder-width. Lower to ~90° knees with hips flat on pad; no lockout.","Pieds largeur d'épaules. Descendre genoux ~90°, bassin collé au siège ; ne pas verrouiller.","Hips lifting off pad; knees caving.","Bassin qui décolle ; genoux vers l'intérieur.",["ssq"]],
slc:["Seated leg curl","Leg curl assis","Hamstrings","Ischio-jambiers","M",0,"Pad above heels, full curl, 3 s return.","Coussin au-dessus des talons, flexion complète, retour en 3 s.","Hips lifting.","Bassin qui se soulève.",["gb"]],
le:["Leg extension","Leg extension","Quads","Quadriceps","M",0,"Pad above ankles, extend, pause 1 s at top.","Coussin au-dessus des chevilles, tendre, pause 1 s en haut.","Swinging.","Élan.",["lp"]],
hp:["Machine hip thrust","Hip thrust machine","Glutes","Fessiers","M",0,"Upper back on pad, drive hips up, ribs down, squeeze 1 s.","Haut du dos sur le coussin, monter le bassin, côtes basses, serrer 1 s.","Over-arching lower back.","Cambrer le bas du dos.",["gb"]],

ssq:["Smith split squat (supported)","Fente bulgare au Smith (appui)","Quads, glutes","Quadriceps, fessiers","SM",1,"Hold for balance, upright torso, lower straight down.","Se tenir pour l'équilibre, buste droit, descendre à la verticale.","Leaning far forward.","Trop pencher le buste.",["lp"]],
ckb:["Cable glute kickback","Kickback fessier poulie","Glutes","Fessiers","C",0,"Ankle strap, hold frame, kick back with flat back, squeeze.","Sangle à la cheville, se tenir, pousser la jambe en arrière dos plat, serrer.","Arching to swing.","Cambrer pour balancer.",["gb"]]};
